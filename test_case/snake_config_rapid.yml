# RAPID config — the DEFAULT for iterating on the workflows end to end.
# `snake_config_baseline.yml` is the comprehensive one; use that for the
# baseline, a milestone seal, or any run whose numbers get read.
#
# Cheap where the cost is, full where a code path would otherwise be skipped:
#   - horizontime_climate 2050. weathergenr generates from 2010 to the horizon
#     (prepare_weagen_config.compute_nr_years anchors at 2010), so the HORIZON
#     sets the series length, not run_length: 46 years here vs 78 for the seed.
#   - run_length 8 — WF3's wflow time is RLZ_NUM x ST_NUM x this. EVEN, because
#     forcing_window snaps ceil backwards and round forwards, so 7 and 8 both
#     yield the same 9-year window and the odd value just misreports itself.
#   - 2 models x 1 scenario = 4 WF2 series, not 9. Two models rather than one,
#     so the multi-model ensemble reduction still runs.
#   - run_historical: true. st_0 is what the two class-C month indicators are
#     derived FROM, so `false` drops 2 of 11 q metrics with nothing reporting it.
#
# Paths are relative to the repo root (where you run Snakemake), not to this file.

project:
  project_dir: test_case/test_rapid
  static_dir: config
  data_sources: config/catalogs/deltares_data.yml
  data_sources_climate: config/catalogs/cmip6_data.yml

shared:
  basin:
    region: "{'subbasin': [9.666, 0.4476], 'uparea': 100}"
    resolution: 0.00833
    gauge_points: test_case/test_data/output_locations.csv
  historical_window:
    # 17 calendar years — one clear of the 16-year weathergenr floor
    # (constraints.min_historical_years). Sizes the era5 climate store.
    starttime: "2000-01-01T00:00:00"
    endtime: "2016-12-31T00:00:00"
  clim_historical: era5
  wflow_outvars: ['river discharge', 'actual evapotranspiration', 'groundwater recharge']

workflows:
  # WF0 — the basin's historical climate, WITHOUT building a hydrology model.
  # Every key below is optional; with none set this draws the canonical figure
  # set for `shared.clim_historical` and nothing else, which is exactly what
  # WF1 already produces. `candidate_sources` is what makes it a comparison.
  analyze_climate:
    enabled: true
    config_path: snake_config_rapid_analyze_climate.yml
  build_model:
    enabled: true
    config_path: snake_config_rapid_build_model.yml

  analyze_projections:
    enabled: true
    config_path: snake_config_rapid_analyze_projections.yml

  run_stress_test:
    enabled: true
    config_path: snake_config_rapid_run_stress_test.yml
