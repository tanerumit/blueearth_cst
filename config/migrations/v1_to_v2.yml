# R14 — the v1 → v2 config mapping. NORMATIVE (design D-11.2a).
#
# This file is the SPECIFICATION the rewriter executes. The register in
# `dev/milestones/r14/config-shape-scoping.md` (`C-01`..`C-85`) is the ARGUMENT
# for each change; 85 rows of markdown table cannot be executed, and cannot be
# checked for completeness. This can.
#
# **Completeness is enforced in three directions**, by
# `tests/test_migration_mapping.py`:
#   1. every register row has an entry here, and every entry names a register row;
#   2. every `moves[].old_path` that is a T1/T2 config key appears in
#      `config_composition.RETIRED_KEYS`, and every `RETIRED_KEYS` entry appears
#      here. Those are two records of one fact and drift between them is the
#      failure this milestone has produced six times;
#   3. every `value_transform` and `exception_hook` names a transform the
#      rewriter implements.
#
# ## Schema, and one deviation from D-11.2a
#
# D-11.2a specifies flat `old_path` / `new_path` fields per row. Five rows move
# MORE than one key — `C-22` (two engine paths), `C-33` (two spell factors),
# `C-34` (three compute knobs), `C-63` (three member keys), `C-67` (two keys
# collapsing into one) — so a flat shape cannot express them without splitting
# one register row across several entries and breaking the 1:1 traceability the
# completeness check depends on.
#
# Every row therefore carries a `moves:` LIST, possibly empty. Each move has the
# fields D-11.2a names. `moves: []` means the row changes no config key, and
# then `applies:` says what it does change instead.
#
#   id                 the `C-nn` this implements — traceable to its argument
#   status             live | withdrawn | superseded
#   applies            config | code | doc | decision | none
#   moves[].old_path   dotted v1 path. `T1.` or `T2.<workflow>.` prefixed
#   moves[].new_path   dotted v2 path; null means DELETE
#   moves[].op         rename | regroup | delete | retype | new
#   moves[].value_transform   identity | iso_to_year | bool_to_enum |
#                             step_num_to_n_levels | pair_to_window |
#                             list_to_named_windows | scalar_to_var_mapping |
#                             list_to_preference_group
#   moves[].on_collision      refuse | overwrite | keep_existing
#   moves[].default_if_absent value, or `omit`
#   moves[].exception_hook    null | warn_st0 | refuse_water_year
#
# `on_collision: refuse` is the default everywhere and is deliberate: a
# destination that already exists means the set is partially migrated, which
# D-11.2b says a human must look at.

schema: 1
migration: v1_to_v2
register: dev/milestones/r14/config-shape-scoping.md

# --------------------------------------------------------------------------
# OPEN — this value is NOT settled, and the rewriter must not run until it is.
# --------------------------------------------------------------------------
# `C-32`'s enum below is `transient | constant`, taken from the register row,
# which is RULED (2026-08-24). The CODE disagrees: `_check_trajectories`'
# refusal message, its test, and `prepare_weagen_config.TRAJECTORY_KINDS` all
# say `transient | step`. Emitting `constant` would produce configs the loader
# then refuses.
#
# The mapping states the ruled value because it is the normative record; the
# consistency check in `tests/test_migration_mapping.py` compares it against
# `TRAJECTORY_KINDS` and is RED until one side moves. That red is the flag, not
# a defect in this file. Resolving it is P1c Gate 1.
open_questions:
  - id: C-32
    question: >-
      the trajectory enum is `transient | constant` in the ruled register row
      and `transient | step` in shipped code
    blocks: the rewriter emitting a value the loader accepts
    owner: P1c Gate 1

