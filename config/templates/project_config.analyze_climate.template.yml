# =============================================================================
#  analyze_climate (wf0) -- the basin's historical climate, no model needed
# =============================================================================
#
# This workflow has no settings of its own. It reads the project file:
#
#   basin.region       where
#   climate.sources    which datasets to compare
#   climate.selected   which one leads the figures (may be empty for this workflow)
#   climate.window     which years
#
# The file is empty on purpose, so you can see nothing is missing. Keep it
# next to the project file, or delete it together with its `config_path` line.
