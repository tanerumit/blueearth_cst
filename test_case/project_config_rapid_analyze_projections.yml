models:
- NOAA-GFDL/GFDL-ESM4
- INM/INM-CM4-8
scenarios: [ssp245]
variables:
  precip: {source: precip, canonical: rate, units: mm/day, change: relative}
  temp: {source: temp, canonical: state, units: degC, change: absolute}
ensemble: cmip6
catalog: config/catalogs/cmip6_data.yml

# Ends 2014, where the CMIP6 historical experiment stops; a later end is
# clipped to it, and clipping a range equal to historical_window is what
# raises the "no longer aligns" warning.
reference_window:
  start: 2000
  end: 2014
# Matches WF3's forcing window (horizontime_climate +/- run_length/2 =
# 2050 +/- 4), which is computed independently of this key.
future_windows:
- start: 2046
  end: 2054
  name: mid
members:
  preference:
  - r1i1p1f1
