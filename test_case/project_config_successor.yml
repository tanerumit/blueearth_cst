# =============================================================================
#  SUCCESSOR BASELINE -- the R12 successor-layout twin of project_config_baseline
# =============================================================================
#
# Byte-identical to `project_config_baseline.yml` except `project.project_dir`
# and the four `config_path` names. It exists because the standing fixture at
# `test_case/test_local` is WHOLLY predecessor: all 75 unmapped paths in
# `snapshot_project_tree.py` are pre-R12 output (72 under the old
# `experiments/experiment/`, two `snake_config_*.yml` run snapshots, one old log
# name), so no pruning or map amendment can repair it -- only a fresh successor
# run can. See
# `dev/milestones/r12/implementation/evidence/standing-seal-status.md`.
#
# Writing to a SEPARATE root is deliberate: `test_case/test_local` is untracked
# and therefore shared by every branch, so replacing it in place would change the
# baseline gate for all worktrees before the old-to-new comparison has been
# judged. Point `check_baseline.py` here; the standing fixture is replaced only
# once that evidence is accepted.
#
# Paths are relative to the repo root, where you run Snakemake, except
# `config_path`, which is relative to this file.

schema_version: 2


# -----------------------------------------------------------------------------
#  PROJECT
# -----------------------------------------------------------------------------

project:
  project_dir: test_case/test_successor
  catalog: config/catalogs/deltares_data.yml


# -----------------------------------------------------------------------------
#  BASIN
# -----------------------------------------------------------------------------

basin:
  region: "{'subbasin': [9.666, 0.4476], 'uparea': 100}"
  resolution: 0.00833
  output_locations: test_case/test_data/output_locations.csv
  delineation:
    max_subbasins: 11


# -----------------------------------------------------------------------------
#  CLIMATE
# -----------------------------------------------------------------------------

climate:
  sources:
  - era5
  selected: era5
  # 17 years: one more than the 16-year minimum.
  window:
    start: 2000
    end: 2016


# -----------------------------------------------------------------------------
#  MODEL
# -----------------------------------------------------------------------------

model:
  outvars: ["river discharge", "groundwater recharge"]


# -----------------------------------------------------------------------------
#  WORKFLOWS
# -----------------------------------------------------------------------------

workflows:
  analyze_climate:
    enabled: true
  build_model:
    enabled: true
    config_path: project_config_successor_build_model.yml
  analyze_projections:
    enabled: true
    config_path: project_config_successor_analyze_projections.yml
  generate_scenarios:
    enabled: true
    config_path: project_config_successor_generate_scenarios.yml
  simulate_system:
    enabled: true
    config_path: project_config_successor_simulate_system.yml
