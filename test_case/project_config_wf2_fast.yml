# =============================================================================
#  WF2 FAST -- for iterating on analyze_projections code only
# =============================================================================
#
# One model, one scenario: two series instead of nine, so a code change in
# the projections stage costs minutes rather than tens of minutes. Writes to
# its own project folder, so it never touches the baseline fixture.
#
# Not a baseline seed: never point check_baseline.py here.
#
# Paths are relative to the repo root, where you run Snakemake, except
# `config_path`, which is relative to this file.

schema_version: 2


# -----------------------------------------------------------------------------
#  PROJECT
# -----------------------------------------------------------------------------

project:
  project_dir: test_case/test_dev
  catalog: config/catalogs/deltares_data.yml


# -----------------------------------------------------------------------------
#  BASIN
# -----------------------------------------------------------------------------

basin:
  region: "{'subbasin': [9.666, 0.4476], 'uparea': 100}"
  resolution: 0.00833
  output_locations:
  delineation:
    max_subbasins: 11


# -----------------------------------------------------------------------------
#  CLIMATE
# -----------------------------------------------------------------------------

climate:
  sources:
  - era5
  selected: era5
  window:
    start: 2000
    end: 2020


# -----------------------------------------------------------------------------
#  MODEL
# -----------------------------------------------------------------------------

model:
  # Discharge only: this set exists for wf2, and more outputs only add work.
  outvars: ["river discharge"]


# -----------------------------------------------------------------------------
#  WORKFLOWS
# -----------------------------------------------------------------------------

workflows:
  analyze_climate:
    enabled: true
  build_model:
    enabled: true
    config_path: project_config_wf2_fast_build_model.yml
  analyze_projections:
    enabled: true
    config_path: project_config_wf2_fast_analyze_projections.yml
  run_stress_test:
    enabled: true
    config_path: project_config_wf2_fast_run_stress_test.yml
