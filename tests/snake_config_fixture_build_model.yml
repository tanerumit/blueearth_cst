# O-04: these once pointed at tests/data/observations/, a tree that has
# never existed. The suite passed anyway -- empirical proof that both
# consumers guard on file EXISTENCE, not on the value. Made honest here
# rather than left as an accidental pass.
observations_timeseries: null
