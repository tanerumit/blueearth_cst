# Quarto project for the BlueEarth CST documentation site.
#
# Rooted at docs/, not at the repository root, so the render scope is a
# directory that already holds only documentation. Design and phasing:
# dev/working/2026-08-19_quarto-docs-site/design.md
#
# PHASE 3, in progress (t2608202351b). The site publishes the landing page,
# setup guide and user guide. The scientific approach and toolbox reference summarize current methods and interfaces
# without republishing the 2025 note. That note's 38 figures are absent from the
# repository, so it remains outside the render list (t2608202351). Its GUI and
# platform chapters remain unpublished by ruling O-1c.
#
# Nothing here publishes. There is deliberately no `site-url` and no deploy
# workflow: the subpath a GitHub Pages project page needs is not known until the
# repository has a home, and a wrong one breaks links only once deployed.
project:
  type: website
  output-dir: _site
  resources:
    - "guide/assets/shape-of-a-run.html"
  render:
    # Globs, not directories. A bare `guide/` matches nothing and renders
    # nothing -- silently, with a successful exit and a smaller site.
    - "index.qmd"
    - "guide/*.qmd"
    - "scientific-approach/*.qmd"
    - "toolbox-reference/*.qmd"
    # Explicit, like everything else here: quarto special-cases a 404.qmd only
    # when it is rendered, and this project enumerates its render targets.
    - "404.qmd"
    # The setup guide, rendered where it already lives. These two are NOT moved
    # into a setup/ directory: ten files across pixi.toml, scripts/, dev/ and
    # README.md cite these paths, and a navbar entry does the same job for free.
    - "install.md"
    - "env_setup_notes.md"

    # Vendored upstream Deltares documentation. Held here so an agent can read
    # it offline; republishing it would put a second, staler copy of hydromt's
    # and wflow's own docs at a URL that looks authoritative. Link out instead.
    - "!hydromt-user-guide/"
    - "!hydromt-wflow/"
    - "!wflow-user-guide/"
    - "!hydromt-architecture.md"

    # Not in the render list at all, and left that way on purpose:
    #   notebooks/  -- their outputs are stripped by policy (commit a2596d0), so
    #                  a no-execute render publishes code with no results. The
    #                  ruling O-2(a) reverses this via a committed docs/_freeze/,
    #                  which is filed but not yet done -- t2608202351a.

website:
  title: "Climate Stress Testing (CST) Toolbox"
  description: "Climate stress testing for water systems — the workflow toolbox"
  favicon: _images/favicon.svg
  navbar:
    left:
      - text: "User guide"
        href: guide/quick-start.qmd
      - text: "Setup"
        href: install.md
      - text: "Scientific approach"
        href: scientific-approach/overview.qmd
      - text: "Toolbox reference"
        href: toolbox-reference/overview.qmd
    right:
      - icon: github
        href: https://github.com/tanerumit/blueearth_cst
        aria-label: "Source on GitHub"
  sidebar:
    - title: "User guide"
      style: docked
      collapse-level: 3
      contents:
        - section: "Getting started"
          contents:
            - guide/quick-start.qmd
            - guide/configuration.qmd
        - section: "Running and results"
          contents:
            - guide/running.qmd
            - guide/outputs.qmd
    - title: "Setup"
      style: docked
      collapse-level: 3
      contents:
        - section: "Installation"
          contents:
            - install.md
            - env_setup_notes.md
    - title: "Scientific approach"
      style: docked
      collapse-level: 3
      contents:
        - scientific-approach/overview.qmd
        - section: "Methods and interpretation"
          contents:
            - scientific-approach/models-and-methods.qmd
            - scientific-approach/climate-information.qmd
            - scientific-approach/conventions-and-interpretation.qmd
    - title: "Toolbox reference"
      style: docked
      collapse-level: 3
      contents:
        - toolbox-reference/overview.qmd
        - section: "Workflows"
          href: toolbox-reference/workflows.qmd
          contents:
            - toolbox-reference/workflow-analyze-climate.qmd
            - toolbox-reference/workflow-build-model.qmd
            - toolbox-reference/workflow-analyze-projections.qmd
            - toolbox-reference/workflow-generate-scenarios.qmd
            - toolbox-reference/workflow-simulate-system.qmd
        - section: "Modeling Tools"
          href: toolbox-reference/modeling-tools.qmd
          contents:
            - text: "Overview"
              href: toolbox-reference/modeling-tools.qmd
        - section: "Datasets"
          href: toolbox-reference/datasets.qmd
          contents:
            - text: "Overview"
              href: toolbox-reference/datasets.qmd
  search:
    location: navbar
    type: textbox
  page-footer:
    center: "Deltares · World Bank Global Water Practice — GPL-3.0"

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme.scss, theme-dark.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    code-overflow: wrap

language:
  search-text-placeholder: Search

# The site must never execute anything during a build. A render has no
# project_dir, no CMIP6 access and no Julia, and a fresh rapid run costs ~73
# minutes. `freeze: auto` means a document is only ever executed if its stored
# output is missing or stale -- and nothing here is executable yet.
execute:
  freeze: auto
