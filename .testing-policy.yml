# Default verification posture for this repo, read by the `testing-policy` skill.
# Schema: ~/workspace/brain/artifacts/skills/testing-policy/references/configuration.md
#
# rapid — focused checks per task; fast plus affected contracts at ordinary merges.
# CI owns full software coverage; local full adds only needed extra coverage.
# All-five execution covers changes to several workflow handoffs or shared runtime.
# Release/milestone labels alone add no tests; reuse applicable candidate evidence.
# Classify the delta since applicable verification, not the preceding batch or folder.
# The per-gate commands: AGENTS.md, validation ladder.
scope: rapid

# `numerical:` is left at its default. A change that moves a number escalates
# per claim. Independent numerical checks cover confined changes; whole-tree
# baseline claims use `dev/scripts/check_baseline.py` with current inputs.
