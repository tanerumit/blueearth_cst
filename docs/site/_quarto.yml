# Quarto project for the BlueEarth CST documentation site.
#
# Rooted at docs/site/, so repository-only sources stay outside the render
# scope. Documentation layout and authoring entry point: docs/README.md.
#
# The site stages canonical guide/manual chapters and complete local indicator sources.
# Existing scientific pages are retained; new scientific writing is deferred.
# Upstream references, notebooks and developer guidance stay outside the render list.
#
# Nothing here publishes. There is deliberately no `site-url` and no deploy
# workflow: the subpath a GitHub Pages project page needs is not known until the
# repository has a home, and a wrong one breaks links only once deployed.
project:
  type: website
  output-dir: _site
  pre-render:
    - "python ../../dev/scripts/stage_site_guides.py"
  resources:
    - "guide/assets/shape-of-a-run.html"
    - "manuals/**"
  render:
    # Globs, not directories. A bare `guide/` matches nothing and renders
    # nothing -- silently, with a successful exit and a smaller site.
    - "index.qmd"
    - "downloads.qmd"
    - "guide/*.qmd"
    - "technical-manual/*.qmd"
    - "technical-manual/appendices/*.qmd"
    - "scientific-approach/*.qmd"
    - "toolbox-reference/*.qmd"
    # Explicit, like everything else here: quarto special-cases a 404.qmd only
    # when it is rendered, and this project enumerates its render targets.
    - "404.qmd"
    # Setup pages are kept together; live references were updated with the move.
    - "setup/*.md"

    # Repository-only sources live outside docs/site. The notebook publication
    # task must stage frozen copies here before adding them to this render list.

website:
  title: "Climate Stress Testing (CST) Toolbox"
  description: "Climate stress testing for water systems — the workflow toolbox"
  favicon: _images/favicon.svg
  page-navigation: true
  navbar:
    left:
      - text: "User guide"
        href: guide/quick-start.qmd
      - text: "Technical manual"
        href: technical-manual/overview.qmd
      - text: "Scientific approach"
        href: scientific-approach/overview.qmd
      - text: "Downloads"
        href: downloads.qmd
    right:
      - icon: github
        href: https://github.com/tanerumit/blueearth_cst
        aria-label: "Source on GitHub"
  sidebar:
    - title: "User guide"
      style: docked
      collapse-level: 3
      contents:
        - section: "Getting started"
          contents:
            - guide/install.qmd
            - guide/quick-start.qmd
            - guide/new-case.qmd
            - guide/configuration.qmd
        - section: "Running and results"
          contents:
            - guide/running.qmd
            - guide/indicators.qmd
            - guide/outputs.qmd
            - guide/benchmarking.qmd
        - section: "Help and interactive use"
          contents:
            - guide/troubleshooting.qmd
            - guide/notebooks.qmd
        - downloads.qmd
    - title: "Scientific approach"
      style: docked
      collapse-level: 3
      contents:
        - scientific-approach/overview.qmd
        - section: "Methods and interpretation"
          contents:
            - scientific-approach/models-and-methods.qmd
            - scientific-approach/climate-information.qmd
            - scientific-approach/conventions-and-interpretation.qmd
    - title: "Technical manual"
      style: docked
      collapse-level: 3
      contents:
        - technical-manual/overview.qmd
        - technical-manual/environment.qmd
        - technical-manual/configuration.qmd
        - technical-manual/input-formats.qmd
        - technical-manual/datasets.qmd
        - section: "Workflows"
          href: technical-manual/workflows.qmd
          contents:
            - text: "0.Analyze climate"
              href: technical-manual/workflow-analyze-climate.qmd
            - text: "1.Build model"
              href: technical-manual/workflow-build-model.qmd
            - text: "2.Analyze projections"
              href: technical-manual/workflow-analyze-projections.qmd
            - text: "3.Generate scenarios"
              href: technical-manual/workflow-generate-scenarios.qmd
            - text: "4.Simulate system"
              href: technical-manual/workflow-simulate-system.qmd
        - section: "Results and provenance"
          contents:
            - technical-manual/retained-handoffs.qmd
            - technical-manual/execution-and-provenance.qmd
            - technical-manual/results-transfer.qmd
        - section: "Indicators"
          contents:
            - technical-manual/indicator-requests.qmd
            - technical-manual/indicator-extension.qmd
            - text: "Module contract"
              href: technical-manual/appendices/indicator-module.qmd
            - text: "Default indicators"
              href: technical-manual/appendices/indicator-default.qmd
            - text: "Flow regime"
              href: technical-manual/appendices/indicator-flow-regime.qmd
            - text: "Environmental flow (ERFA)"
              href: technical-manual/appendices/indicator-eflow-erfa.qmd
            - text: "Crop-water screening"
              href: technical-manual/appendices/indicator-crop-water.qmd
            - text: "Flood discharge hazards"
              href: technical-manual/appendices/indicator-flood-risk.qmd
  search:
    location: navbar
    type: textbox
  page-footer:
    center: "Deltares · World Bank Global Water Practice — GPL-3.0"

format:
  html:
    theme:
      light: [cosmo, styles/theme.scss]
      dark: [cosmo, styles/theme.scss, styles/theme-dark.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    code-overflow: wrap

language:
  search-text-placeholder: Search

filters:
  - ../../dev/scripts/publication_links.lua

# Commands are displayed examples. Rendering must never execute code or acquire data.
execute:
  enabled: false
