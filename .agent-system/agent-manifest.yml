# This block is the Codex ROOT discovery catalog, not an availability switch:
# every brain skill an active role binds is already reachable without being
# listed here (Codex routes it per-agent, Claude reads it via the path-read
# rule in config/ai/AGENTS.md). A line here spends root-catalog budget to put
# a description in front of the ROOT agent unprompted. So the test for adding
# one is "does the root agent invoke this directly?", never "do I want it".
#
# Budget: the managed EFFECTIVE catalog (this manifest + the user scope) was
# 9,211 chars across 19 skills on 2026-09-06, against an 8,000-char floor and
# the accepted_ceiling of 10,857 in brain config/ai/codex-catalog-budget.yml.
# Crossing the ceiling fails `brain status --strict` (ADR 0003 D1).
