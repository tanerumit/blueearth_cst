# Controls the git-workflow skill's ceremony for THIS repo.
# Schema: ~/workspace/brain/artifacts/skills/git-workflow/references/configuration.md
#
# `mode` is a ladder ordered by where work happens; each rung pins every toggle
# below, so a rung replaces reasoning about the individual keys.
#   trunk  — the primary checkout, trunk only, no feature branches.
#   branch — a branch when the work is risky or multi-session.  (skill default)
#   slot   — every modifying task in a claimed persistent worktree.  (current)
#   lane   — a fresh session per task, against a frozen readiness SHA.
# `lite` and `full` are permanent aliases for `trunk` and `branch`.
mode: slot

# Below: only the overrides. Each beats the rung; every key left out takes the
# `slot` value — isolation_landing `auto`, and worktree_policy `always`, which
# reserves this primary checkout for integration and starts every modifying
# task in a claimed worktree instead (agent-honored, and enforced by the
# launcher and the PreToolUse guard).

# The trunk is pushed deliberately, never as a side effect of finishing a task.
# `true` re-enables the >24h / 25-commit backup trigger.
auto_push: false # true | false

# Overridden back off the rung's `advisory`: `task-start` gives every task a
# fresh process, an unguessable claim and an explicit write scope, then enforces
# the scope, readiness, integration and cleanup transitions. `advisory` hard-
# fails every `task-*` and `integration-*` verb, so it needs a drained pool.
session_slots: [session-1, session-2, session-3]
slot_registry: atomic # advisory | atomic

# `hybrid` lets a low-risk READY task dispatch to git-integrator automatically;
# scientific, numerical, configuration, dependency, API, migration, release and
# destructive changes still wait for approval. `approval` holds every task;
# `self` runs no separate reviewer and integrates from the primary checkout.
integration_mode: hybrid # approval | hybrid | self

# Untracked trees the launcher COPIES (never links) into each new worktree.
# Without them the fixture-dependent tests skip and the suite reports a false
# green. Rationale: dev/reference/task-lanes.md.
worktree_seed:
  - test_case/test_local          # 46 MB; named by 18 of the 25 fixture references
  - test_case/basin_map_fixture   # 248 KB; only dev/scripts/preview_basin_map.py

# Untracked agent config the launcher SYMLINKS (never copies) into each new
# worktree: it is read, not written, and one shared definition is the point.
# Without it a worktree session loses the 14 project skills and the 10 personas
# with no error — the catalog is simply smaller. Rationale:
# dev/reference/task-lanes.md.
worktree_link:
  - .claude   # skills/ + agents/, symlinks into ~/workspace/brain/artifacts
  - .codex    # Codex personas (regular files, no brain fallback)
  - .agents   # runtime-neutral skills/

# Environment the launcher BUILDS in each new worktree — it can be neither
# copied nor symlinked. `.pixi/` embeds absolute paths, so a copy is subtly
# broken and a link points two checkouts at one mutable prefix. `pixi install`
# is not the whole environment: weathergenr comes from GitHub via remotes and
# the Julia env from Pkg.instantiate(), both under `pixi run install`.
# Runs after seeding and linking; a failure is reported, not fatal, and never
# unwinds an otherwise-correct worktree. Skip once with --no-provision.
# VERIFY AFTERWARDS — a missing env is gitignored and invisible to git status:
#   pixi run python dev/scripts/check_env.py --all
worktree_provision:
  - pixi install
  - pixi run install
