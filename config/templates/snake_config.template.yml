# Config template for blueearth_cst — the PROJECT file.
#
# A project's configuration is a set of files, not one file: this project file
# plus one file per workflow. Copy them all, renaming as you go, and point
# Snakemake at the project file only:
#
#   snake_config.template.yml                  ->  snake_config_<project>.yml
#   snake_config.build_model.template.yml      ->  snake_config_<project>_build_model.yml
#   snake_config.analyze_projections.template.yml
#                                              ->  snake_config_<project>_analyze_projections.yml
#   snake_config.run_stress_test.template.yml  ->  snake_config_<project>_run_stress_test.yml
#
#   snakemake all -c 3 -s build_model.smk --configfile snake_config_<project>.yml
#
# Then fix each `config_path:` below to name your renamed copy. Keep the whole
# set in ONE directory: a `config_path` is resolved relative to THIS file, not
# to where you run from, so the set moves as a unit and a colleague can run it
# unchanged. Every OTHER path key resolves from the run directory as before.
#
# A workflow you never run needs no file: delete its `config_path` key and set
# `enabled: false`. Do not leave a `config_path` naming a file that is not
# there — that is a hard parse error, on purpose, so a typo cannot pass.
#
# Migrating a single-file config written before 2026-08? Run
# `python scripts/split_project_config.py <your config>` — it proposes the split
# without touching your file. See docs/migration-config-tiers.md.
#
# Paths are relative to the directory you RUN from (the repo root), or absolute.
# Commented-out keys are optional and show their default.
#
# Why the defaults are what they are: config/templates/README.md.
# A filled-in example: test_case/snake_config_baseline.yml.

project:
  project_dir: /path/to/my_project                        # path — absolute, outside the repo
  catalog: config/catalogs/deltares_data.yml              # path
  # Randomization seed for every stochastic step (today: the weather generator,
  # for both realization generation and the perturbation). Optional — absent, it
  # takes `defaults.seed` from config/advanced_settings.yml.
  #
  #   <integer>  the same realizations every run, on any machine
  #   auto       derived from the experiment name: different experiments get
  #              different realizations, and re-running one reproduces it
  #              exactly. Recompute it any time from the name alone.
  #
  # Not a per-invocation random draw. That would rewrite the generator config on
  # every run and re-execute the whole stress test each time.
  #seed: auto                                             # integer | auto
  # First month of the water (hydrological) year. Optional — absent, it takes
  # `defaults.water_year_start` (Jan) from config/advanced_settings.yml.
  #
  # ONE key for every workflow that reduces to an annual value: WF2's change
  # factors, WF3's weather generation, WF3's hydrological indicators and WF1's
  # climate figures. Replaced `workflows.analyze_projections.start_month_hyd_year`,
  # which is now refused — it never reached the arithmetic.
  #
  # Set it to the month your basin's hydrological year begins (e.g. Oct for a
  # northern-hemisphere water year). It matters most for the annual EXTREMES in
  # the response surface: a Jan-Dec year splits a flood season that crosses New
  # Year across two years and understates the annual maximum. A non-Jan value
  # moves those numbers by design.
  #water_year_start: Oct                                  # Jan..Dec
  #julia_threads: 4                                       # integer

workflows:
  # WF0 — historical climate analysis. Model-free: it needs only the region and
  # a data catalog, so it runs before (or without) the hydrology model.
  analyze_climate:
    enabled: true                                         # boolean
    # `C-84`: WF0 has no settings of its own -- everything it needs is in the
    # project file above. The file ships anyway so the set is legible: four
    # workflows, four files. It and this key travel together (D-7.9) -- a
    # `config_path` naming a file that is not there is a hard parse error.
    config_path: snake_config.analyze_climate.template.yml
  build_model:
    enabled: true                                         # boolean
    config_path: snake_config.build_model.template.yml

  analyze_projections:
    enabled: true                                         # boolean
    config_path: snake_config.analyze_projections.template.yml

  run_stress_test:
    enabled: true                                         # boolean
    config_path: snake_config.run_stress_test.template.yml
basin:
  region: "{'subbasin': [9.666, 0.4476], 'uparea': 100}"    # text — hydromt region spec
  resolution: 0.00833333                                  # numeric — degrees (1/120 = 30 arcsec)
    #hydrography: merit_hydro_ihu                         # text — catalog entry name
    #basin_index: merit_hydro_index                       # text — catalog entry name
  delineation:
    river_uparea_km2: 32                                  # numeric — km2
    snap_tolerance_m: 10000                               # numeric — metres
    max_subbasins: 11                                     # integer
  sources:                                                # text — catalog entry names
    rivers: rivers_lin2019_v1
    lulc: vito
    lai: modis_lai
    soil: soilgrids
  # How much climate record to EXTRACT — drives the climate store, the climate
  # figures and (through the store) weathergenr. NOT the model run period; see
  # workflows.build_model.simulation_window.
  output_locations:                                       # path | null
model:
  outvars: ["river discharge", "actual evapotranspiration"]
climate:
  selected: era5                                          # text — entry in data_sources
  # list — any of: river discharge, overland flow, actual evapotranspiration,
  #                groundwater recharge, snow
  window:
    start: 1990
    end: 2020
  sources:
  - era5
schema_version: 2
