# =============================================================================
#  BASELINE, LINUX -- the baseline set with Linux data-catalog paths
# =============================================================================
#
# Same basin as `project_config_baseline.yml`, pointed at the Linux catalog.
# Must parse cleanly; end-to-end validation on Linux is deferred
# (dev/roadmap.md).
#
# Paths are relative to the repo root, where you run Snakemake, except
# `config_path`, which is relative to this file.

schema_version: 2


# -----------------------------------------------------------------------------
#  PROJECT
# -----------------------------------------------------------------------------

project:
  project_dir: test_case/gabon
  catalog: config/catalogs/deltares_data_linux.yml


# -----------------------------------------------------------------------------
#  BASIN
# -----------------------------------------------------------------------------

basin:
  region: "{'subbasin': [9.666, 0.4476], 'uparea': 100}"
  resolution: 0.0062475
  output_locations:
  delineation:
    max_subbasins: 11


# -----------------------------------------------------------------------------
#  CLIMATE
# -----------------------------------------------------------------------------

climate:
  sources:
  - era5
  selected: era5
  window:
    start: 2000
    end: 2020


# -----------------------------------------------------------------------------
#  MODEL
# -----------------------------------------------------------------------------

model:
  outvars:
  - river discharge
  - actual evapotranspiration


# -----------------------------------------------------------------------------
#  WORKFLOWS
# -----------------------------------------------------------------------------

workflows:
  analyze_climate:
    enabled: true
  build_model:
    enabled: true
    config_path: project_config_baseline_linux_build_model.yml
  analyze_projections:
    enabled: true
    config_path: project_config_baseline_linux_analyze_projections.yml
  run_stress_test:
    enabled: true
    config_path: project_config_baseline_linux_run_stress_test.yml
