<!doctype html><meta charset="utf-8"><title>Scientific figure comparison</title>
<style>body{margin:24px;font:15px system-ui;background:#edf0f4;color:#182330}header{display:flex;align-items:center;gap:20px}select,button{padding:8px}main{display:grid;grid-template-columns:1fr 1fr;gap:18px}article{background:white;border-radius:8px;padding:12px}h2{font-size:16px}img{width:100%;display:block}#overlay{display:none;position:relative;background:white;max-width:1100px;margin:auto}#overlay img{width:100%}#newlayer{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}body.wipe main{display:none}body.wipe #overlay{display:block}input{width:250px}.note{color:#526173}.figure-caption{display:none;font-size:12px;line-height:1.5;color:#68717b;text-align:left;margin-top:10px;margin-bottom:4px}body.captions-on .figure-caption{display:block}#caption-toggle{width:auto}header{flex-wrap:wrap}body.canvas-on main img,body.canvas-on #overlay{outline:1px dashed #697b8c;outline-offset:0}body.canvas-on article{background:#e4e9ef}#canvas-toggle{width:auto}main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}article{min-width:0}main img{width:auto;max-width:100%;max-height:60vh;height:auto;margin:0 auto}#overlay{width:fit-content;max-width:100%}#overlay img{width:auto;max-width:100%;max-height:60vh;height:auto}#newlayer{width:100%!important;height:100%!important;object-fit:contain}body.canvas-on main img{outline:none}body.canvas-on .figure-canvas{outline:1px dashed #697b8c}.figure-canvas{background:white;margin:0 auto;max-width:100%;display:flow-root}.figure-canvas img{width:100%;max-height:none}.figure-canvas .figure-caption{padding-bottom:10px}#overlay{display:none}body.wipe #overlay{display:flow-root}#overlay-caption{padding-bottom:10px}#newlayer{height:auto!important;object-fit:initial}.review-controls{display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin:0 0 18px}header h1{margin-top:0}main article h2{margin-top:0}</style>
<header><h1>Scientific figure comparison</h1></header><div class="review-controls"><select id="choice"></select><button id="mode">Overlay comparison</button><input id="slider" type="range" value="50" min="0" max="100"><label><input id="caption-toggle" type="checkbox"> Show captions</label><label><input id="canvas-toggle" type="checkbox" checked> Show canvas boundary</label></div>
<main><article><h2 id="before-title"></h2><div class="figure-canvas"><img id="before"><p class="figure-caption" id="before-caption"></p></div></article><article><h2 id="after-title"></h2><div class="figure-canvas"><img id="after"><p class="figure-caption" id="after-caption"></p></div></article></main>
<div id="overlay"><img id="oldlayer"><img id="newlayer"><p class="figure-caption" id="overlay-caption"></p></div>
<p style="overflow-wrap:anywhere">Path:<br><code id="existing-path"></code></p><script>const items=[];const select=document.querySelector('#choice');items.forEach((x,i)=>select.add(new Option(x.label,i)));function show(){if(!items.length){document.getElementById('before-title').textContent='Add figure records to const items to begin.';return;}const x=items[select.value];const chart=x.label.replace(' · ',' - ');document.getElementById('before-title').textContent=chart+' (existing)';document.getElementById('after-title').textContent=chart+' (revised)';before.src=oldlayer.src=x.before;setCaption('before-caption',x.before_caption,x.before_edges);setCaption('after-caption',x.after_caption,x.after_edges);setCaption('overlay-caption',x.after_caption,x.after_edges);after.src=newlayer.src=x.after+(x.after.includes('?')?'&':'?')+'v='+(x.version||'');document.querySelector('#existing-path').textContent=x.existing_path.slice(0,Math.max(x.existing_path.lastIndexOf(String.fromCharCode(92)),x.existing_path.lastIndexOf('/'))+1);}select.onchange=show;document.querySelector('#mode').onclick=()=>document.body.classList.toggle('wipe');slider.oninput=()=>newlayer.style.clipPath=`inset(0 ${100-slider.value}% 0 0)`;function setCaption(id,text="",edges=[0,1]){const el=document.getElementById(id);el.textContent=text;el.style.marginLeft=(edges[0]*100)+'%';el.style.marginRight=((1-edges[1])*100)+'%';}document.getElementById('caption-toggle').onchange=e=>document.body.classList.toggle('captions-on',e.target.checked);document.body.classList.add('canvas-on');document.getElementById('canvas-toggle').onchange=e=>document.body.classList.toggle('canvas-on',e.target.checked);show();function sizeCanvases(){const imgs=['before','after'].map(id=>document.getElementById(id)).filter(img=>img.naturalWidth);if(!imgs.length)return;const available=Math.min(...imgs.map(img=>img.closest('article').clientWidth-24));const scale=Math.min(available/(140/25.4*600),innerHeight*0.6/(80/25.4*600),...imgs.map(img=>available/img.naturalWidth),...imgs.map(img=>innerHeight*0.6/img.naturalHeight));for(const img of imgs){img.parentElement.style.width=(img.naturalWidth*scale)+'px';img.parentElement.querySelector('.figure-caption').style.fontSize=(6/72*600*scale)+'px';}document.getElementById('overlay-caption').style.fontSize=(6/72*600*scale)+'px';}for(const id of ['before','after'])document.getElementById(id).addEventListener('load',sizeCanvases);window.addEventListener('resize',sizeCanvases);sizeCanvases();</script>
