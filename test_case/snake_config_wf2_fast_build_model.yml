model_build_config: config/defaults/wflow_build_model.yml
waterbodies_config: config/defaults/wflow_update_waterbodies.yml
# Kept discharge-only on purpose: this is the baseline-recording seed, and
# extra outputs would only churn the copied-config fingerprint without adding
# any fingerprinted target. The shipped default (template / Snakefile) does
# include 'actual evapotranspiration'.
wflow_outvars: ["river discharge"]
observations_timeseries: null
