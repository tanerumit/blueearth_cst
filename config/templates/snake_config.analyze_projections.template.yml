# mapping per variable. canonical: rate | state ; change: relative | absolute
variables:
  precip: {source: precip, canonical: rate, units: mm/day, change: relative}
  temp: {source: temp, canonical: state, units: degC, change: absolute}
historical_year_range: [1985, 2014]                   # [integer, integer] — inclusive, clipped at 2014
future_horizons:                                      # mapping: name -> [integer, integer]
  near: [2030, 2060]
  far: [2070, 2100]
