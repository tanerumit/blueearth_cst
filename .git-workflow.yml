# .git-workflow.yml
# Git workflow policy for this repository.
# Schema: ~/workspace/brain/artifacts/skills/git-workflow/references/configuration.md

# ── Workflow mode ────────────────────────────────────────────────────────────
#
# trunk  — work directly on the primary branch
# branch — use branches for risky or multi-session work
# slot   — run every modifying task in a reusable session worktree
# lane   — create an isolated, state-managed session for each task
#
# Aliases: lite = trunk; full = branch
mode: slot

# Explicit settings below override the selected mode.

# Push only when requested. Set to true to enable the periodic backup trigger.
auto_push: false

# ── Session worktrees ────────────────────────────────────────────────────────
#
# Available reusable worktrees. Each modifying task claims one of these slots.
session_slots:
  - session-1
  - session-2
  - session-3

# advisory — infer occupancy from the branch checked out in each worktree
# atomic   — enforce ownership through claims, scopes, and readiness state
slot_registry: advisory

# Inherited from `slot`:
#   worktree_policy: always
#   isolation_landing: auto
#
# The primary checkout is reserved for integration. Session branches are
# automatically landed after they are clean, rebased, and verified.
#
# `integration_mode` is omitted because it is inactive with an advisory
# registry.

# ── Worktree setup ───────────────────────────────────────────────────────────

# Copy untracked test data into each new worktree.
# These fixtures are required for complete test coverage.
worktree_seed:
  - test_case/test_local
  - test_case/basin_map_fixture

# Link shared agent configuration into each new worktree.
# Links keep every session on the same skill and persona definitions.
worktree_link:
  - .claude
  - .codex
  - .agents

# Build the environment inside each new worktree.
# Provisioning failures are reported but do not remove the worktree.
# Skip once with `--no-provision`.
worktree_provision:
  - pixi install
  - pixi run install

# Verify a newly provisioned environment with:
# pixi run python dev/scripts/check_env.py --all
