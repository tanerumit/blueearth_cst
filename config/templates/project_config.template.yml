# =============================================================================
#  blueearth_cst -- PROJECT config
# =============================================================================
#
# A project is described by five files: this one, plus one per workflow.
# Copy all five into your project folder and pass only THIS file to
# Snakemake. You may keep the names; if you rename them, update the
# `config_path` lines at the bottom to match:
#
#   project_config.template.yml                      -> project_config.yml
#   project_config.analyze_climate.template.yml      -> project_config_analyze_climate.yml
#   project_config.build_model.template.yml          -> project_config_build_model.yml
#   project_config.analyze_projections.template.yml  -> project_config_analyze_projections.yml
#   project_config.run_stress_test.template.yml      -> project_config_run_stress_test.yml
#
#   snakemake all -c 3 -s build_model.smk --configfile project_config.yml
#
# Keep the five files in one folder. `config_path:` is relative to this file;
# every other path is relative to where you run Snakemake, or absolute.
#
# This file holds what several workflows share: the basin, the historical
# climate, the model outputs. Settings used by one workflow only go in that
# workflow's file.
#
# Lines starting with `#` are optional settings, shown at their default.
# Background on the defaults: config/templates/README.md.
# A filled-in example: test_case/project_config_rapid.yml and its siblings.

schema_version: 2                          # leave as is


# -----------------------------------------------------------------------------
#  PROJECT
# -----------------------------------------------------------------------------

project:
  project_dir: /path/to/my_project         # absolute path, outside this repository
  catalog: config/catalogs/deltares_data.yml   # hydromt data catalog listing every dataset


# -----------------------------------------------------------------------------
#  BASIN
# -----------------------------------------------------------------------------

basin:
  # hydromt region, in quotes. This form: the basin draining to a point
  # (lon, lat), at least 100 km2 upstream. Other forms:
  # docs/hydromt-user-guide/models/model_region.md
  region: "{'subbasin': [9.666, 0.4476], 'uparea': 100}"
  resolution: 0.00833333                   # degrees (1/120 = 30 arc-seconds)

  # Points where the model reports results. Each `control` point also closes
  # a subbasin. Columns: output_locations_template.csv. null = outlets only.
  output_locations: /path/to/output_locations.csv   # path | null

  # How the basin is split into subbasins.
  #delineation:
  #  river_uparea_km2: 32                   # a cell is river above this upstream area
  #  snap_tolerance_m: 10000                # how far a point may move to reach the river
  #  max_subbasins: 11                      # per basin

  # Datasets used to build the basin, by catalog entry name.
  #sources:
  #  hydrography: merit_hydro_ihu           # must match setup_basemaps in the build config
  #  basin_index: merit_hydro_index
  #  rivers: rivers_lin2019_v1
  #  lulc: vito
  #  lai: modis_lai
  #  soil: soilgrids


# -----------------------------------------------------------------------------
#  CLIMATE
# -----------------------------------------------------------------------------

climate:
  # Datasets to consider, and the one the model runs on. `selected` must be
  # in `sources`. You may leave `selected` empty while only analyze_climate
  # is enabled: run it, read the comparison, then choose.
  sources: [era5, chirps]
  selected: era5

  # Years of record to extract, inclusive. At least 16. This is not the model
  # run period; see `simulation_window` in the build_model file.
  window:
    start: 1990
    end: 2020

  # First month of the water year. Changes every annual statistic.
  #water_year_start: Jan                   # Jan..Dec


# -----------------------------------------------------------------------------
#  MODEL
# -----------------------------------------------------------------------------

model:
  # Any of: river discharge, overland flow, actual evapotranspiration,
  # groundwater recharge, snow. Observations can only be given for these.
  outvars: ["river discharge", "actual evapotranspiration"]


# -----------------------------------------------------------------------------
#  WORKFLOWS
# -----------------------------------------------------------------------------
#
# To skip a workflow: `enabled: false`, and remove its `config_path` line.

workflows:
  analyze_climate:
    enabled: true
    config_path: project_config.analyze_climate.template.yml
  build_model:
    enabled: true
    config_path: project_config.build_model.template.yml
  analyze_projections:
    enabled: true
    config_path: project_config.analyze_projections.template.yml
  run_stress_test:
    enabled: true
    config_path: project_config.run_stress_test.template.yml
