clim_project: cmip6
models:
  - NOAA-GFDL/GFDL-ESM4
  - CMCC/CMCC-ESM2
  - INM/INM-CM5-0
scenarios: [ssp245, ssp585]
members: [r1i1p1f1]
variables:
  precip: {source: precip, canonical: rate, units: mm/day, change: relative}
  temp: {source: temp, canonical: state, units: degC, change: absolute}
historical_year_range: [1980, 2010]
future_horizons:
  near: [2030, 2060]
  far: [2070, 2100]
