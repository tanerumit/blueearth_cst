engine:
  build_config: config/defaults/wflow_build_model.yml              # path
  waterbodies_config: config/defaults/wflow_update_waterbodies.yml # path
observations:                                         # path | null — needs gauge_points
# The period the hydrological model is RUN over: sets the forcing prepared
# for it AND the wflow TOML's [time] window, which are necessarily equal.
# OPTIONAL — omit and it follows shared.historical_window exactly.
#
# Must sit INSIDE shared.historical_window: the forcing is built from the
# extracted climate store, so a simulation period outside the record has no
# data behind it. Analysing 1990-2020 and simulating 2000-2020 is the
# intended shape. The >= 16-year floor applies to the RECORD only, so a
# short run is allowed.
# Editing this rebuilds the forcing and re-runs the model.
#simulation_window:
#  starttime: "2000-01-01T00:00:00"                    # ISO datetime
#  endtime: "2020-12-31T00:00:00"                      # ISO datetime
