# =============================================================================
#  build_model (wf1) -- build the Wflow-SBM model, run it on the historical record
# =============================================================================
#
# Keep this next to the project file. The basin, climate record and output
# variables come from there; only the model build and its run are set here.


# -----------------------------------------------------------------------------
#  OBSERVATIONS
# -----------------------------------------------------------------------------

# One observed series per variable in `model.outvars`. Optional. Needs
# `basin.output_locations`; columns are matched by wflow_id.
# Format: observed_daily_discharge_template.csv.
observations:
  river discharge: /path/to/observed_discharge.csv   # path | null


# -----------------------------------------------------------------------------
#  RUN PERIOD
# -----------------------------------------------------------------------------

# Years the model runs over, inclusive. Default: all of `climate.window`.
# Must lie inside `climate.window`. Can be short.
#simulation_window:
#  start: 2000
#  end: 2020


# -----------------------------------------------------------------------------
#  ENGINE
# -----------------------------------------------------------------------------

# hydromt build settings. These are the defaults; point at your own copies
# to change how the model is built.
#engine:
#  build_config: config/defaults/wflow_build_model.yml
#  waterbodies_config: config/defaults/wflow_update_waterbodies.yml
