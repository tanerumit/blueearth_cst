# FAST DEV CONFIG — for iterating on WF2 code, not for recording anything.
#
# Why this exists: the seed config resolves 9 series (3 models x {historical,
# ssp245, ssp585}), and any edit to an enumerated reducer module invalidates all
# of them, so a code change costs a full network re-derivation. Two of those reads
# (the ssp585 pair) individually exceed a 10-minute tool timeout. This config
# resolves **2** series, which makes an iteration loop minutes instead of tens of
# minutes.
#
# Differences from test_case/snake_config_baseline.yml, and ONLY these:
#   - project_dir: test_case/test_dev   (its own tree; never touches the
#     baseline fixture, whose manifested summary/plots are derived from all
#     3 models and would be wrong if regenerated from 1)
#   - models:    one model  (NOAA-GFDL/GFDL-ESM4)
#   - scenarios: one scenario (ssp245)
#
# NOT a baseline seed. `dev/baseline/manifest.json` is recorded from
# snake_config_baseline.yml and nothing else; never point check_baseline here.
# The first run pays a one-off climate-store extraction for the new project_dir.

project:
  project_dir: test_case/test_dev
  static_dir: config
  data_sources: config/catalogs/deltares_data.yml
  data_sources_climate: config/catalogs/cmip6_data.yml

shared:
  basin:
    region: "{'subbasin': [9.666, 0.4476], 'uparea': 100}"
    resolution: 0.00833
    gauge_points: null
    automatic_subbasins:
      max_per_basin: 11
  historical_window:
    starttime: "2000-01-01T00:00:00"
    endtime: "2020-12-31T00:00:00"
  clim_historical: era5

workflows:
  # WF0 — the basin's historical climate, WITHOUT building a hydrology model.
  # Every key below is optional; with none set this draws the canonical figure
  # set for `shared.clim_historical` and nothing else, which is exactly what
  # WF1 already produces. `candidate_sources` is what makes it a comparison.
  analyze_climate:
    enabled: true
  build_model:
    enabled: true
    config_path: snake_config_wf2_fast_build_model.yml
  analyze_projections:
    enabled: true
    config_path: snake_config_wf2_fast_analyze_projections.yml

  run_stress_test:
    enabled: true
    config_path: snake_config_wf2_fast_run_stress_test.yml
