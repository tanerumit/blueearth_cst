# analyze_projections (wf2) -- baseline set

catalog: config/catalogs/cmip6_data.yml
ensemble: cmip6

models:
- NOAA-GFDL/GFDL-ESM4
- INM/INM-CM4-8
- INM/INM-CM5-0
scenarios: [ssp245, ssp585]
members:
  preference:
  - r1i1p1f1

variables:
  precip: {source: precip, canonical: rate, units: mm/day, change: relative}
  temp: {source: temp, canonical: state, units: degC, change: absolute}

# Ends 2014, where the CMIP6 historical runs stop.
reference_window:
  start: 2000
  end: 2014
future_windows:
- start: 2070
  end: 2090
  name: far
