models:
- NOAA-GFDL/GFDL-ESM4
- CMCC/CMCC-ESM2
- INM/INM-CM5-0
scenarios: [ssp245, ssp585]
variables:
  precip: {source: precip, canonical: rate, units: mm/day, change: relative}
  temp: {source: temp, canonical: state, units: degC, change: absolute}
ensemble: cmip6
catalog: config/catalogs/cmip6_data.yml

reference_window:
  start: 1980
  end: 2010
future_windows:
- start: 2030
  end: 2060
  name: near
- start: 2070
  end: 2100
  name: far
members:
  preference:
  - r1i1p1f1
